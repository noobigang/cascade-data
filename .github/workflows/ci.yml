name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Lint with ruff
        # Use find to enumerate all .py files; bash glob expansion in 'run'
        # steps is unreliable on Linux runners.
        run: |
          FILES=$(find lineage ui tests -name "*.py" -not -path "*/__pycache__/*")
          ruff check $FILES

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mypy types-networkx
      - name: mypy
        # --config-file reads [tool.mypy] from pyproject.toml which loosens
        # checks for this UI codebase. --explicit-package-bases avoids
        # needing __init__.py in the tests directory.
        run: |
          FILES=$(find lineage ui -name "*.py" -not -path "*/__pycache__/*")
          mypy --config-file pyproject.toml $FILES --explicit-package-bases

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # Pass test file as absolute path and add repo to PYTHONPATH so
        # the test can import the lineage and ui packages without needing
        # a tests/__init__.py.
        run: |
          PYTHONPATH=. pytest tests/test_lineage.py -v --tb=short
