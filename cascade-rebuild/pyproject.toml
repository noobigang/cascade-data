[project]
name = "cascade"
version = "1.0.0"
description = "Column-level data lineage dashboard for dbt projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "networkx>=3.0",
    "sqlglot>=25.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
pretty = true
# The dashboard is a UI app — strict typing for inference is overkill
# and creates false positives (e.g. Returning Any from optional sqlglot
# APIs, var-annotated for dynamically-built lists). Loosen the checks
# we don't care about for this codebase.
disable_error_code = [
    "no-any-return",
    "var-annotated",
    "assignment",
    "union-attr",
    "arg-type",
    "index",
    "attr-defined",
    "call-arg",
    "misc",
    "operator",
    "return-value",
]