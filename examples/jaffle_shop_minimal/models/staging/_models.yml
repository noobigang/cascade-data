version: 2

models:
  - name: stg_orders
    description: "Cleaned and typed orders"
    columns:
      - name: order_id
        description: "Primary key of the order"
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Foreign key to dim_customers.customer_id"
        tests:
          - not_null
      - name: order_date
        description: "Date the order was placed"
      - name: status
        description: "Order status"
      - name: amount
        description: "Order total in USD"
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned and typed customers"
    columns:
      - name: customer_id
        description: "Primary key of the customer"
        tests:
          - not_null
          - unique
      - name: first_name
        description: "Customer's first name"
      - name: last_name
        description: "Customer's last name"
      - name: email
        description: "Customer's email address"
      - name: created_at
        description: "When the customer was created"
