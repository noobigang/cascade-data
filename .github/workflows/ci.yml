name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Lint with ruff
        # List files explicitly via find — bash glob expansion in 'run' steps
        # is unreliable on Linux runners.
        run: |
          FILES=$(find cascade-rebuild -name "*.py" -not -path "*/__pycache__/*" -not -path "*/build/*" -not -path "*/dist/*")
          ruff check $FILES

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mypy types-networkx
      - name: mypy
        # Pass --explicit-package-bases so mypy can find the lineage package
        # without an __init__.py-less tests directory. The find enumerates
        # exactly the .py files we want to type-check.
        run: |
          FILES=$(find cascade-rebuild/lineage cascade-rebuild/ui -name "*.py" -not -path "*/__pycache__/*")
          mypy $FILES --ignore-missing-imports --explicit-package-bases

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r cascade-rebuild/requirements.txt
      - name: Run tests
        # Add tests/ to PYTHONPATH and pass the test file directly so pytest
        # doesn't need an __init__.py in the tests dir.
        run: |
          cd cascade-rebuild
          PYTHONPATH=. pytest tests/test_lineage.py -v --tb=short
