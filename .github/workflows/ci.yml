name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      # Scope to the new app under cascade-rebuild/. The legacy cascade/
      # directory is no longer maintained and its files are not linted.
      # Use globs to avoid ruff complaining about missing __init__.py.
      - run: ruff check cascade-rebuild/lineage/*.py cascade-rebuild/ui/*.py cascade-rebuild/app.py cascade-rebuild/tests/*.py

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mypy types-networkx
      - run: mypy cascade-rebuild/lineage/ cascade-rebuild/ui/ --ignore-missing-imports

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e cascade-rebuild/
      - run: pip install -r cascade-rebuild/requirements.txt
      - run: pytest cascade-rebuild/tests/ -v --tb=short
