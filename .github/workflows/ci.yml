name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      # Use find to enumerate all .py files under cascade-rebuild/, excluding
      # the legacy cascade/ directory. Linux bash doesn't always expand globs
      # inside `run` steps, so we list files explicitly.
      - name: Lint with ruff
        run: |
          FILES=$(find cascade-rebuild -name "*.py" -not -path "*/.venv/*" -not -path "*/__pycache__/*" -not -path "*/build/*" -not -path "*/dist/*")
          ruff check $FILES

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mypy types-networkx
      - run: mypy cascade-rebuild/lineage/ cascade-rebuild/ui/ --ignore-missing-imports

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e cascade-rebuild/
      - run: pip install -r cascade-rebuild/requirements.txt
      - run: pytest cascade-rebuild/tests/ -v --tb=short
