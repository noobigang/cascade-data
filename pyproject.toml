[project]
name = "cascade-data"
version = "0.1.0"
description = "dbt lineage impact analyzer"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28",
    "networkx>=3.2",
    "pyvis>=0.3.1",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["cascade*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-networkx",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line-length in HTML/CSS string blocks is acceptable

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "pyvis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true