version: 2

sources:
  - name: raw
    description: "Raw data from the operational database"
    tables:
      - name: orders
        description: "Raw orders from the OLTP system"
        columns:
          - name: order_id
            description: "Primary key of the order"
            tests:
              - not_null
              - unique
          - name: customer_id
            description: "Foreign key to customers.customer_id"
            tests:
              - not_null
          - name: order_date
            description: "When the order was placed"
          - name: status
            description: "Order status (placed / shipped / completed / returned)"
          - name: amount
            description: "Order total in USD"
            tests:
              - not_null
      - name: customers
        description: "Raw customer records"
        columns:
          - name: customer_id
            description: "Primary key of the customer"
            tests:
              - not_null
              - unique
          - name: first_name
            description: "Customer's first name"
          - name: last_name
            description: "Customer's last name"
          - name: email
            description: "Customer's email address"
          - name: created_at
            description: "When the customer was created"
